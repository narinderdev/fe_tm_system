<div class="login-container">
  <div class="login-card" [formGroup]="form">
    <div class="logo-wrap">
      <img src="/assets/icons/logo1.svg" alt="Logo" class="auth-logo" />
    </div>
    <h2 class="title">Welcome Back</h2>
    <p class="subtitle">Login to manage your assets</p>

    <!-- EMAIL -->
    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrapper">
        <input
          type="email"
          name="email"
          formControlName="email"
          placeholder="Enter your email"
        />
        <span class="input-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path
              d="M3 6h18v12H3z"
              stroke="currentColor"
              fill="none"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M3 6l9 6 9-6"
              stroke="currentColor"
              fill="none"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </div>

      <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        Enter a valid email.
      </small>
    </div>

    <!-- PASSWORD -->
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrapper">
        <input
          [type]="passwordVisible ? 'text' : 'password'"
          name="password"
          formControlName="password"
          placeholder="Enter your password"
        />
        <span class="input-icon icon-button" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
          <ng-container *ngIf="passwordVisible; else hiddenIcon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path
                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                stroke="currentColor"
                fill="none"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </ng-container>
          <ng-template #hiddenIcon>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path
                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                stroke="currentColor"
                fill="none"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" fill="none" />
            </svg>
          </ng-template>
        </span>
      </div>

      <small class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        Password is required.
      </small>

    </div>

    <!-- LOGIN BUTTON -->
    <button class="btn-login" type="submit" (click)="submit()" [disabled]="loading">
      <ng-container *ngIf="!loading; else loadingTpl">
        Login
        <span class="arrow">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="3"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"
            />
          </svg>
        </span>
      </ng-container>
      <ng-template #loadingTpl>
        <app-spinner></app-spinner>
      </ng-template>
    </button>

    <button
      *ngIf="showChangePasswordButton"
      class="btn-change-password"
      type="button"
      (click)="goToChangePassword()"
    >
      Change Password
    </button>

  </div>
</div>
