<div class="auth-page">
  <div class="auth-card" [formGroup]="form">
    <h2 class="title">Set Password</h2>
    <p class="subtitle">{{ email || 'Invalid invite link' }}</p>

    <div class="form-group password-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <input
          id="password"
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password"
          placeholder="Create password"
          (focus)="onPasswordFocus()"
          (blur)="onPasswordBlur('password')"
        />
        <button type="button" class="icon-btn" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
          <span *ngIf="!passwordVisible">&#128065;</span>
          <span *ngIf="passwordVisible">&#128584;</span>
        </button>
      </div>

      <div class="password-checklist" *ngIf="showPasswordChecklist">
        <div [class.ok]="hasMinLength">Minimum 12 characters</div>
        <div [class.ok]="hasUppercase">Uppercase letters</div>
        <div [class.ok]="hasLowercase">Lowercase letters</div>
        <div [class.ok]="hasSpecialCharacter">Special characters ($ @ # % ^ & * ? - + =)</div>
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <div class="input-wrapper">
        <input
          id="confirmPassword"
          [type]="confirmPasswordVisible ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Confirm password"
          (blur)="onPasswordBlur('confirmPassword')"
        />
        <button type="button" class="icon-btn" (click)="toggleConfirmPasswordVisibility()" aria-label="Toggle confirm password visibility">
          <span *ngIf="!confirmPasswordVisible">&#128065;</span>
          <span *ngIf="confirmPasswordVisible">&#128584;</span>
        </button>
      </div>
      <small class="error" *ngIf="passwordMismatch">Passwords do not match.</small>
    </div>

    <div class="global-error" *ngIf="globalError">{{ globalError }}</div>

    <button class="submit-btn" type="button" (click)="submit()" [disabled]="disableSubmit">
      <ng-container *ngIf="!loading; else loadingTpl">Set Password</ng-container>
      <ng-template #loadingTpl>
        <app-spinner></app-spinner>
      </ng-template>
    </button>
  </div>
</div>
