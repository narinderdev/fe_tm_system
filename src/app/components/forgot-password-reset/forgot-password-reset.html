<div class="auth-page">
  <div class="auth-card" [formGroup]="form">
    <h2 class="title">Set New Password</h2>
    <p class="subtitle">{{ email }}</p>

    <div class="form-group">
      <label for="newPassword">New Password</label>
      <div class="input-wrapper">
        <input
          id="newPassword"
          [type]="newPasswordVisible ? 'text' : 'password'"
          formControlName="newPassword"
          placeholder="Enter new password"
          (focus)="onPasswordFocus()"
          (blur)="onPasswordBlur('newPassword')"
        />
        <button type="button" class="icon-btn" (click)="toggleNewPasswordVisibility()">
          {{ newPasswordVisible ? 'Hide' : 'Show' }}
        </button>
      </div>

      <div class="password-checklist" *ngIf="showPasswordChecklist">
        <div [class.ok]="hasMinLength">Minimum 12 characters</div>
        <div [class.ok]="hasUppercase">At least 1 uppercase letter</div>
        <div [class.ok]="hasLowercase">At least 1 lowercase letter</div>
        <div [class.ok]="hasSpecialCharacter">At least 1 special character</div>
      </div>

      <small class="error" *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.errors?.['required']">
        New password is required.
      </small>
      <small class="error" *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.errors?.['pattern']">
        Password must meet all required rules.
      </small>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <div class="input-wrapper">
        <input
          id="confirmPassword"
          [type]="confirmPasswordVisible ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Confirm new password"
          (blur)="onPasswordBlur('confirmPassword')"
        />
        <button type="button" class="icon-btn" (click)="toggleConfirmPasswordVisibility()">
          {{ confirmPasswordVisible ? 'Hide' : 'Show' }}
        </button>
      </div>

      <small class="error" *ngIf="form.get('confirmPassword')?.touched && form.get('confirmPassword')?.errors?.['required']">
        Confirm password is required.
      </small>
      <small class="error" *ngIf="passwordMismatch">Passwords do not match.</small>
    </div>

    <small class="error" *ngIf="inlineError">{{ inlineError }}</small>

    <button class="submit-btn" type="button" (click)="submit()" [disabled]="loading || form.invalid">
      <ng-container *ngIf="!loading; else loadingTpl">Reset Password</ng-container>
      <ng-template #loadingTpl>
        <app-spinner></app-spinner>
      </ng-template>
    </button>
  </div>
</div>
