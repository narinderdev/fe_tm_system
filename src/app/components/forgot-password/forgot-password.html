<div class="auth-page">
  <div class="auth-card" [formGroup]="form">
    <h2 class="title">Forgot Password</h2>
    <p class="subtitle">Enter your email and we will send a 6-digit verification code.</p>

    <div class="form-group">
      <label for="email">Email Address</label>
      <div class="input-wrapper">
        <input id="email" type="email" formControlName="email" placeholder="Enter your email" />
      </div>
      <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        Enter a valid email.
      </small>
    </div>

    <button class="submit-btn" type="button" (click)="submit()" [disabled]="loading">
      <ng-container *ngIf="!loading; else loadingTpl">Send Code</ng-container>
      <ng-template #loadingTpl>
        <app-spinner></app-spinner>
      </ng-template>
    </button>

    <p class="switch-auth">
      Remembered your password?
      <a routerLink="/login">Back to Login</a>
    </p>
  </div>
</div>
