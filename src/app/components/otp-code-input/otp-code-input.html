<div
  class="otp-inputs"
  [class.compact]="size === 'compact'"
  role="group"
  [attr.aria-label]="groupAriaLabel"
  [style.--otp-length]="length"
  (paste)="onPaste($event)"
>
  <input
    #otpInput
    *ngFor="let digit of digits; let i = index; trackBy: trackByIndex"
    type="text"
    inputmode="numeric"
    autocomplete="one-time-code"
    pattern="[0-9]*"
    maxlength="1"
    [disabled]="disabled"
    [value]="digit"
    [attr.aria-label]="inputAriaLabelPrefix + ' ' + (i + 1)"
    (input)="onInput(i, $event)"
    (keydown)="onKeyDown(i, $event)"
    (focus)="onFocus($event)"
  />
</div>
