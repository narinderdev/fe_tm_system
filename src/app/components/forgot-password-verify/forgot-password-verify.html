<div class="auth-page">
  <div class="auth-card">
    <h2 class="title">Verify Code</h2>
    <p class="subtitle">
      Enter the 6-digit code sent to <span class="email">{{ email }}</span>.
    </p>

    <div class="otp-inputs">
      <input
        #otpInput
        *ngFor="let _ of code; let i = index; trackBy: trackByIndex"
        type="text"
        maxlength="1"
        inputmode="numeric"
        autocomplete="one-time-code"
        [value]="code[i]"
        (input)="onInput($event, i)"
        (keydown)="onBackspace($event, i)"
        (paste)="onPaste($event, i)"
      />
    </div>

    <small class="error" *ngIf="inlineError">{{ inlineError }}</small>

    <button class="submit-btn" type="button" (click)="verify()" [disabled]="loading">
      <ng-container *ngIf="!loading; else loadingTpl">Verify Code</ng-container>
      <ng-template #loadingTpl>
        <app-spinner></app-spinner>
      </ng-template>
    </button>

    <button class="link-btn" type="button" (click)="useDifferentEmail()">Use a different email</button>
  </div>
</div>
